<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Yugioh Probability Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-dark text-light">

  <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg bg-secondary text-light p-4 border-warning" style="max-width: 400px; width: 100%;">
      <div class="card-body">
        <h3 class="card-title text-center text-warning mb-4 fw-bold">
          <i class="bi bi-shield-lock-fill me-2"></i>System AuthN / AuthZ
        </h3>
        
        <form id="signin-form">
          <div class="mb-3">
            <label for="role-select" class="form-label">Select Access Role</label>
            <select id="role-select" class="form-select bg-dark text-light border-warning">
              <option value="Admin">Admin (Full CRUD Permissions)</option>
              <option value="User">Standard User (Read-Only)</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="username-input" class="form-label">Username</label>
            <input type="text" id="username-input" class="form-control bg-dark text-light border-warning" value="SpacemanSpiff12" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold text-dark mt-2">Sign In / Update Session</button>
        </form>

        <div id="auth-status" class="mt-3 text-center small text-info d-none">
          Session updated successfully! Redirecting...
        </div>
      </div>
    </div>
    <div class="mt-3">
      <a href="../index.html" class="text-warning text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>

  <script>
    document.getElementById("signin-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const role = document.getElementById("role-select").value;
      const username = document.getElementById("username-input").value;

      // Save user session state to sessionStorage
      const sessionUser = { username, role };
      sessionStorage.setItem("ygo_user", JSON.stringify(sessionUser));

      const status = document.getElementById("auth-status");
      status.classList.remove("d-none");

      setTimeout(() => {
        window.location.href = "../index.html";
      }, 1000);
    });
  </script>
</body>
</html>
