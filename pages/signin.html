<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGO Draw Odds - Sign In</title>

  <!-- External Stylesheets & Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning">
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="../index.html">
          <i class="bi bi-pie-chart-fill me-2"></i>YGO Draw Odds
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-secondary">
          <div class="card-header bg-dark text-warning fw-bold text-center">
            <i class="bi bi-shield-lock me-1"></i> Duelist Sign In
          </div>
          <div class="card-body">
            <form id="signin-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" class="form-control" id="username" placeholder="Enter duelist name">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••">
              </div>
              <button type="button" id="signin-btn" class="btn btn-warning w-100 fw-bold">Sign In</button>
            </form>
          </div>
          <div class="card-footer text-center text-muted small">
            Shell Interface — Sign in logic inactive
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-light py-4 border-top border-warning mt-auto">
    <div class="container text-center">
      <p class="mb-1">YGO Draw Odds Shell — Created for Coursework Project</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="https://github.com/SpacemanSpiff12" target="_blank" class="text-warning text-decoration-none">
          <i class="bi bi-github me-1"></i>GitHub Profile
        </a>
        <span class="text-secondary">|</span>
        <a href="https://github.com/SpacemanSpiff12/psychic-octo-broccoli-bravo-lab" target="_blank" class="text-warning text-decoration-none">
          <i class="bi bi-code-slash me-1"></i>Repository Code
        </a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
