<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGO Draw Odds - Tool & Form</title>

  <!-- External Stylesheets & Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning">
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="../index.html">
          <i class="bi bi-pie-chart-fill me-2"></i>YGO Draw Odds
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="deck-builder.html">Deck Odds Tool</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signin.html">Sign In</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="container my-4">
    <h1 class="h3 mb-3 text-warning">Deck Odds Calculation Form</h1>
    <p class="text-muted">Enter custom card parameters below to simulate drawing odds in future versions.</p>

    <!-- Data Input Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white fw-bold">
        <i class="bi bi-calculator me-1"></i> Calculate Custom Card Ratio
      </div>
      <div class="card-body">
        <form id="add-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="card-title" class="form-label">Card Name / Combo Group</label>
              <input type="text" class="form-control" id="card-title" placeholder="e.g., Infinite Impermanence">
            </div>

            <div class="col-md-3">
              <label for="deck-size" class="form-label">Total Deck Size</label>
              <input type="number" class="form-control" id="deck-size" value="40" min="40" max="60">
            </div>

            <div class="col-md-3">
              <label for="copies-count" class="form-label">Copies in Deck</label>
              <select class="form-select" id="copies-count">
                <option value="1">1 Copy (Limited)</option>
                <option value="2">2 Copies (Semi-Limited)</option>
                <option value="3" selected>3 Copies (Unlimited)</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="card-category" class="form-label">Card Category</label>
              <select class="form-select" id="card-category">
                <option value="starter">Starter / Engine</option>
                <option value="extender">Extender</option>
                <option value="handtrap">Hand Trap</option>
                <option value="garnet">Garnet / Brick</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="notes" class="form-label">Notes / Description</label>
              <input type="text" class="form-control" id="notes" placeholder="e.g., Must open to perform full combo">
            </div>

            <div class="col-12 text-end">
              <button type="button" id="calculate-btn" class="btn btn-success fw-bold">
                <i class="bi bi-plus-circle me-1"></i> Submit Odds Request
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-light py-4 border-top border-warning mt-auto">
    <div class="container text-center">
      <p class="mb-1">YGO Draw Odds Shell — Created for Coursework Project</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="https://github.com/SpacemanSpiff12" target="_blank" class="text-warning text-decoration-none">
          <i class="bi bi-github me-1"></i>GitHub Profile
        </a>
        <span class="text-secondary">|</span>
        <a href="https://github.com/SpacemanSpiff12/psychic-octo-broccoli-bravo-lab" target="_blank" class="text-warning text-decoration-none">
          <i class="bi bi-code-slash me-1"></i>Repository Code
        </a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
